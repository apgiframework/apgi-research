[project]
name = "autoresearch"
version = "1.1.0"
description = "Autonomous research platform for the Allostatic Precision-Gated Ignition (APGI) framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "GitPython>=3.1.0",
    "customtkinter==5.2.2",
    "kernels>=0.11.7",
    "litellm>=1.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "Pillow>=9.5.0",
    "tiktoken>=0.11.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "pixelmatch>=0.4.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Flat layout: the project's modules sit in the repository root next to the
# `utils`, `experiments` and `visualization_helpers` packages. List them
# explicitly; `paper-miner.py` is a script (its hyphen makes it unimportable).
[tool.setuptools]
py-modules = [
    "APGI_System",
    "GUI_auto_improve_experiments",
    "analyze_experiments",
    "apgi_audit",
    "apgi_cli",
    "apgi_implementation_template",
    "apgi_integration",
    "apgi_metrics",
    "apgi_orchestration_kernel",
    "apgi_security_adapters",
    "apgi_security_consolidated",
    "autonomous_agent",
    "human_layer",
    "hypothesis_approval_board",
    "memory_store",
    "prepare",
    "progress_tracking",
    "train",
    "validation",
    "xpr_agent_engine",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "experiments*", "visualization_helpers*"]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "jsonschema>=4.18.0",
    "hypothesis>=6.100.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "psutil>=5.9.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin' or platform_machine != 'arm64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ---------------------------------------------------------------------------
# Black Configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# ---------------------------------------------------------------------------
# Ruff Configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Correctness and import hygiene gate CI. Stylistic families (N, UP, B, C4, SIM,
# ARG, PTH, RUF) are not enabled: the code base predates them (thousands of
# findings) and enabling them needs a dedicated cleanup.
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",  # Line too long (handled by black)
]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests adjust sys.path before importing project modules.
"*.py" = ["E402"]
# Single-letter names mirror the mathematical notation of the model.
"APGI_System.py" = ["E741"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["apgi"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------------------------------------------------------------------------
# Mypy Configuration (stricter than mypy.ini)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest Configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "experiments"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--disable-warnings",
    "--cov=.",
    "--cov-branch",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "-ra",
    "-q",
    "--strict-markers",
]
markers = [
    "security: marks tests as security-related",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "visual: marks tests as visual regression tests",
    "plots: marks tests as plot visualization tests",
    "e2e: marks tests as end-to-end tests",
    "performance: marks tests as performance tests",
    "stress: marks tests as stress tests",
    "mutation: marks tests for mutation testing",
    "snapshot: marks tests as snapshot tests",
    "race_condition: marks tests that check for race conditions",
    "adversarial: marks tests using adversarial data",
    "boundary: marks tests for boundary value analysis",
    "flaky: marks tests that may be flaky",
    "fuzz: marks tests as fuzzing tests",
    "gui: marks tests as GUI tests",
    "memory: marks tests as memory profiling tests",
]
