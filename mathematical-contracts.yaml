  "notation": {
    "sigma": "logistic sigmoid",
    "clip": "closed-interval clamp",
    "Z": "independent standard normal per state and step",
    "old": "state at start of step",
    "new": "state at end of step"
  },
  "equations": {
    "prediction_error": "eps_e = observed_e - predicted_e; eps_i = observed_i - predicted_i",
    "normalisation": "z_e = (eps_e - calibration_mean_e) / calibration_sd_e; z_i = (eps_i - calibration_mean_i) / calibration_sd_i",
    "pi_i_eff": "pi_i_eff = pi_i_baseline * (1 + beta_som * sigma(M - M_0))",
    "drive": "I = (0.5 * pi_e * z_e^2 + 0.5 * pi_i_eff * z_i^2) / tau_drive",
    "signal": "dS = (-S/tau_S + I) * dt + sigma_S * sqrt(dt) * Z_S",
    "threshold_baseline": "theta_base = theta_sleep + (1 - A) * (theta_alert - theta_sleep)",
    "threshold": "dtheta = ((theta_base-theta)/tau_theta + gamma_M*M + lambda_S*S) * dt + sigma_theta*sqrt(dt)*Z_theta",
    "somatic": "dM = ((tanh(beta_M*z_i)-M)/tau_M + gamma_context*C) * dt + sigma_M*sqrt(dt)*Z_M",
    "arousal": "dA = ((A_target-A)/tau_A)*dt + sigma_A*sqrt(dt)*Z_A",
    "precision_e": "dpi_e = alpha_Pi*(pi_e_target-pi_e)*dt + sigma_Pi*sqrt(dt)*Z_Pi_e",
    "precision_i": "dpi_i_baseline = alpha_Pi*(pi_i_target-pi_i_baseline)*dt + sigma_Pi*sqrt(dt)*Z_Pi_i",
    "ignition": "p_ignition = sigma(gamma_sig*(S_new-theta_new)); B = 1[U < p_ignition] when not refractory, else 0",
    "reset": "S_post = (1-rho)*S_new if B=1 else S_new"
  },
